name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova / Ionic CLI
        run: npm install -g cordova ionic

      - name: Add Android Platform
        run: npx cordova platform add android || npx cap add android || true

      - name: Build Android APK
        run: npx cordova build android || npx cap build android || npm run build || true

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/**/*.apk
            **/platforms/android/app/build/outputs/apk/**/*.apk
